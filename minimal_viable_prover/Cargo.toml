[package]
name = "minimal_viable_prover"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-poly = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["parallel"] }
rand = "0.8"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true

[features]
default = ["parallel"]
parallel = ["ark-std/parallel"] 
